# Perfil dev — base de datos propia del modulo Pedidos (regla de arquitectura: ningun
# otro modulo lee estas tablas).
#
# Levantar la BD antes de arrancar la app:
#   cp .env.example .env
#   docker compose up -d
#
# Los valores por defecto coinciden con los del docker-compose.yml para que la app
# arranque sin exportar nada. Si cambias el .env, exporta las mismas variables en el
# entorno donde corre la app: el .env lo lee Docker, no Spring.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:deliverygo_pedidos}
spring.datasource.username=${POSTGRES_USER:deliverygo}
spring.datasource.password=${POSTGRES_PASSWORD:deliverygo}

# Durante el desarrollo el esquema lo genera Hibernate. Si el modelo se estabiliza,
# pasar a migraciones versionadas.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
