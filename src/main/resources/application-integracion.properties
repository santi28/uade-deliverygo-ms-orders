# Perfil integracion (Etapa 4) — clientes HTTP reales de Catalogo, Usuarios y Pagos.
#
# Con este perfil activo los mocks (@Profile("!integracion")) quedan fuera del contexto y
# toman su lugar las implementaciones de client/http. Sin el perfil corren los mocks.
#
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev,integracion
#
# Las URL no tienen un valor por defecto fijo a proposito: si falta una, el arranque
# falla y se ve al instante. Es mejor que arrancar apuntando a un host inventado y
# descubrirlo en la demo con un 503.
#
# Los puertos de los defaults son una suposicion (uno por equipo) hasta que cada equipo
# confirme el suyo. Los timeouts son los comunes de application.properties.
deliverygo.integraciones.usuarios.base-url=${USUARIOS_BASE_URL:http://localhost:8081}
deliverygo.integraciones.catalogo.base-url=${CATALOGO_BASE_URL:http://localhost:8082}
deliverygo.integraciones.pagos.base-url=${PAGOS_BASE_URL:http://localhost:8084}

# INT-03 — Pagos exige un codigoMedioPago (UUID) ya registrado en su modulo, y nuestro
# ConfirmarPedidoRequest recibe el medio como texto ("TARJETA_CREDITO"). Hasta que se
# alinee DTO-04, el codigo sale de aca: registrar un medio con
# POST /api/v1/payment-methods y poner su codigo. Desvio declarado en PLAN.md.
deliverygo.integraciones.pagos.medio-pago-por-defecto=${PAGOS_MEDIO_PAGO_ID:cccccccc-cccc-cccc-cccc-cccccccccccc}
