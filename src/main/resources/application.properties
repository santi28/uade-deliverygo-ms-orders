# Configuracion comun a todos los perfiles. Lo que depende del entorno vive en
# application-<perfil>.properties.
#
# Perfiles:
#   dev          Postgres del docker-compose.yml. Es el perfil por defecto.
#   test         H2 en memoria; lo activan los tests con @ActiveProfiles("test").
#   integracion  Clientes HTTP reales de Catalogo, Usuarios y Pagos (Etapa 4). Sin este
#                perfil activo corren los mocks (INT-01..04 declarados como mock).
spring.application.name=orders-ms
spring.profiles.default=dev

server.port=${SERVER_PORT:8080}

# JPA
spring.jpa.properties.hibernate.format_sql=true
# Evita que la sesion quede abierta en la vista: las colecciones LAZY se traen con
# JOIN FETCH explicito (DM-02).
spring.jpa.open-in-view=false
spring.jmx.enabled=false

# Swagger / OpenAPI (springdoc): accesible durante la demo (regla de arquitectura).
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.path=/v3/api-docs
