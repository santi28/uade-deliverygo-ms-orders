# Configuracion comun a todos los perfiles. Lo que depende del entorno vive en
# application-<perfil>.properties.
#
# Perfiles:
#   dev          Postgres del docker-compose.yml. Es el perfil por defecto.
#   test         H2 en memoria; lo activan los tests con @ActiveProfiles("test").
#   integracion  Clientes HTTP reales de Catalogo, Usuarios y Pagos (Etapa 4). Sin este
#                perfil activo corren los mocks (INT-01..04 declarados como mock).
spring.application.name=orders-ms
spring.profiles.default=dev

server.port=${SERVER_PORT:8080}

# JPA
spring.jpa.properties.hibernate.format_sql=true
# Evita que la sesion quede abierta en la vista: las colecciones LAZY se traen con
# JOIN FETCH explicito (DM-02).
spring.jpa.open-in-view=false
spring.jmx.enabled=false

# Swagger / OpenAPI (springdoc): accesible durante la demo (regla de arquitectura).
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.path=/v3/api-docs

# Integraciones (INT-01 a INT-04): timeouts de las llamadas a Catalogo, Usuarios y
# Pagos. El read-timeout es el techo de lo que puede tardar un CU por culpa de una
# dependencia; si se vence, el CU responde 503 y no inventa datos.
deliverygo.integraciones.connect-timeout=2s
deliverygo.integraciones.read-timeout=3s

# Desvio registrado en PLAN.md (17/11): con true, CU-03 confirma el pedido cualquiera sea
# su estado de origen, salteando RN-04. Apagado por defecto; el flujo aprobado es el de la
# planilla. Para prenderlo en una corrida puntual, sin tocar este archivo:
#   ./mvnw spring-boot:run -Dspring-boot.run.arguments=--deliverygo.pedidos.confirmar-sin-validacion-estado=true
deliverygo.pedidos.confirmar-sin-validacion-estado=false
